name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # data/raw/*.csv is gitignored -- it is regenerable output, not source, so
      # a fresh checkout has no dataset and the tests must create their own.
      - name: Generate sample data (real data is not committed)
        run: python src/generate_sample_data.py

      - name: Run test suite
        run: pytest -v

      # Unit tests exercise the pieces; this proves the whole pipeline runs
      # start to finish -- load, split, train both models, evaluate, audit, persist.
      - name: Train model (smoke test -- confirms the pipeline runs end to end)
        run: python src/train.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile bakes the trained model and movies.csv into the image,
      # but both are gitignored (regenerable artifacts, not committed) and so are
      # absent from a fresh checkout -- their directories don't even exist, since
      # git doesn't track empty ones. Without these steps the COPY lines in the
      # Dockerfile fail and this job can never pass.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate sample data
        run: python src/generate_sample_data.py

      - name: Train model (produces the artifact the image expects)
        run: python src/train.py

      - name: Build Docker image
        run: docker build -t movie-recommender-api:ci .

      # Building proves the image assembles; this proves it actually serves.
      # The model-loading path is exactly what failed at startup before the
      # namespace-collision fix.
      - name: Smoke-test the container
        run: |
          docker run -d --name rec-api -p 8000:8000 movie-recommender-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fs http://localhost:8000/health | tee /dev/stderr | grep -q '"model_loaded":true'
          curl -fs "http://localhost:8000/recommend/1?k=5" | tee /dev/stderr | grep -q recommended_movie_ids
          docker rm -f rec-api
