name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # data/raw/*.csv is gitignored -- it is regenerable output, not source, so
      # a fresh checkout has no dataset and the tests must create their own.
      - name: Generate sample data (real data is not committed)
        run: python src/generate_sample_data.py

      - name: Run test suite
        run: pytest -v
